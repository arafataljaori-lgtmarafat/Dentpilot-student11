<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oral Surgery Casesheet</title>
<style>
/* ============================================================
   case-sheet-print-template — قالب طباعة الكاسشيت المستقل
   صفحة مستقلة تماماً عن التطبيق: لا هيدر، لا شريط تجربة، لا زر تثبيت،
   لا شعار DentPilot، لا input/select/dropdown — نصوص وخطوط ومربعات اختيار فقط.
   ============================================================ */
*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ background:#fff; color:#111; font-family:"Times New Roman", Georgia, "Segoe UI", serif; font-size:12.5px; line-height:1.55; }
.sheet{ max-width:186mm; margin:0 auto; padding:10px 4px 30px; }

@page{ size:A4; margin:12mm; }
.print-page{ page-break-after:always; }
.page-break{ page-break-before:always; }
.no-break{ break-inside:avoid; page-break-inside:avoid; }

/* شريط أدوات للشاشة فقط — يختفي كلياً في الطباعة/PDF */
.no-print{ position:sticky; top:0; z-index:9; display:flex; gap:8px; justify-content:center; background:#f4f6f8; border-bottom:1px solid #d9dee3; padding:9px; font-family:Tahoma, Arial, sans-serif; }
.no-print button{ font-family:inherit; font-size:13px; font-weight:700; padding:8px 18px; border-radius:8px; border:1px solid #0c7a7a; background:#0c7a7a; color:#fff; cursor:pointer; }
.no-print button.ghost{ background:#fff; color:#0c7a7a; }
@media print{ .no-print{ display:none !important; } }

/* الترويسة الرسمية */
.uni-head{ text-align:center; margin-bottom:8px; }
.uni-head .u1{ font-size:17px; font-weight:700; letter-spacing:.4px; }
.uni-head .u2, .uni-head .u3{ font-size:13px; }
.sheet-title{ text-align:center; font-size:21px; font-weight:700; letter-spacing:2.5px; margin:12px 0 14px; }
hr.rule{ border:0; border-top:1.6px solid #111; margin:6px 0 12px; }

/* عناصر ورقية */
.sec{ margin:11px 0 4px; font-weight:700; font-size:13.5px; text-decoration:underline; }
.line{ display:flex; align-items:baseline; gap:6px; margin:6px 0; }
.line .lbl{ font-weight:700; white-space:nowrap; }
.line .fill{ flex:1; border-bottom:1px solid #333; min-height:15px; padding:0 3px 1px; }
.fill-block{ border-bottom:1px solid #333; min-height:17px; margin:7px 0 2px; padding:0 3px 1px; white-space:pre-wrap; }
.fill-block + .fill-block{ margin-top:12px; }
.ck-row{ margin:6px 0; }
.ck{ white-space:nowrap; margin-inline-end:18px; }
.ck .box{ font-size:14px; }
.inline-lbl{ font-weight:700; }
.two-col{ display:flex; gap:26px; flex-wrap:wrap; }
.two-col > div{ flex:1; min-width:200px; }

/* جدول التقييم */
table.eval{ width:100%; border-collapse:collapse; margin-top:8px; }
table.eval th, table.eval td{ border:1.2px solid #111; padding:9px 8px; font-size:12.5px; text-align:center; }
table.eval th{ font-weight:700; }
table.eval td.crit{ text-align:left; font-weight:700; }
.sig-row{ display:flex; justify-content:space-between; gap:24px; margin-top:26px; }
.sig-row .line{ flex:1; }

/* صفحة الصور */
.ph-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12mm 8mm; margin-top:10mm; }
.ph-box{ border:1.2px solid #111; height:78mm; display:flex; flex-direction:column; }
.ph-box .cap{ border-bottom:1.2px solid #111; text-align:center; font-weight:700; padding:5px; font-size:12.5px; }
.ph-box .img-wrap{ flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:3px; }
.ph-box img{ max-width:100%; max-height:100%; object-fit:contain; }
.ph-box .empty{ color:#999; font-size:11.5px; }
.gen-note{ text-align:center; font-size:10.5px; color:#666; margin-top:10mm; font-family:Tahoma, Arial, sans-serif; }
.err-msg{ text-align:center; font-family:Tahoma, Arial, sans-serif; padding:40px 16px; color:#555; }
</style>
</head>
<body>
  <div class="no-print" id="toolbar">
    <button type="button" id="btnPrint">🖨️ طباعة / حفظ PDF</button>
    <button type="button" class="ghost" id="btnClose">إغلاق</button>
  </div>

  <div class="sheet" id="sheet"><div class="err-msg">جارٍ تجهيز الكاسشيت…</div></div>

<script>
(function () {
  'use strict';
  var KEY = 'dentpilot_student_cs_print_v1';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; }); }
  function box(ck) { return '<span class="box">' + (ck ? '\u2611' : '\u2610') + '</span>'; }
  function ckOne(checked, label) { return '<span class="ck">' + box(checked) + ' ' + label + '</span>'; }
  function yesNo(v) { return ckOne(v === 'yes', 'Yes') + ckOne(v === 'no', 'No'); }
  function opts(v, list) { return list.map(function (o) { return ckOne(v === o[0], o[1]); }).join(''); }
  function multi(d, list) { return list.map(function (o) { return ckOne(!!d[o[0]], o[1]); }).join(''); }
  function line(lbl, val, minw) { return '<div class="line"><span class="lbl">' + lbl + ':</span><span class="fill"' + (minw ? ' style="min-width:' + minw + '"' : '') + '>' + (esc(val) || '&nbsp;') + '</span></div>'; }
  function fillBlock(val, rows) {
    var content = esc(val) || '';
    var html = '<div class="fill-block">' + (content || '&nbsp;') + '</div>';
    for (var i = 1; i < (rows || 1); i++) html += '<div class="fill-block">&nbsp;</div>';
    return html;
  }

  var PHOTO_SLOTS = [
    { key: 'pre1', label: 'Preoperative Image' },
    { key: 'pre2', label: 'Preoperative Image' },
    { key: 'during', label: 'During operative Image' },
    { key: 'xray', label: 'X-ray Image' }
  ];

  function render(payload) {
    var d = (payload && payload.data) || {};
    var photos = (payload && payload.photos) || {};

    var html =
      /* ---------- الصفحة الأولى: عنوان الكاسشيت + بيانات الطالب والمريض والفحوصات ---------- */
      '<div class="sheet-title">ORAL SURGERY</div>' +
      '<hr class="rule" />' +

      '<div class="no-break">' +
        line('Student Name', d.studentName) +
        '<div class="ck-row"><span class="inline-lbl">Level:</span> ' + ckOne(d.level === '4th', '4th Year') + ckOne(d.level === '5th', '5th Year') + '</div>' +
        line('Clinic Date', d.clinicDate) +
        line('Supervisor of starting', d.supervisorStart) +
      '</div>' +
      '<hr class="rule" />' +

      '<div class="no-break">' +
        line('Patient Name', d.patientName) +
        '<div class="ck-row"><span class="inline-lbl">Gender:</span> ' + ckOne(d.gender === 'M', 'M') + ckOne(d.gender === 'F', 'F') +
          ' &nbsp;&nbsp;<span class="inline-lbl">Age:</span> <span class="fill" style="display:inline-block;min-width:44px">' + (esc(d.age) || '&nbsp;') + '</span>' +
          ' &nbsp;&nbsp;<span class="inline-lbl">Marital status:</span> <span class="fill" style="display:inline-block;min-width:60px">' + (esc(d.maritalStatus) || '&nbsp;') + '</span></div>' +
        line('Occupation', d.occupation) +
        line('Address', d.address) +
        line('Phone No', d.phone) +
        '<div class="sec" style="margin-top:9px">Chief Complaint:</div>' + fillBlock(d.chiefComplaint, 2) +
      '</div>' +

      '<div class="no-break"><div class="sec">Medical History:</div>' +
        '<div class="ck-row">' + ckOne(!!d.healthy, 'Healthy') + '</div>' +
        line('Chronic diseases', d.chronic) +
        line('Current medications', d.meds) +
        '<div class="ck-row"><span class="inline-lbl">Allergies:</span> ' + yesNo(d.allergies) + ' &rarr; <span class="fill" style="display:inline-block;min-width:130px">' + (esc(d.allergiesDetail) || '&nbsp;') + '</span></div>' +
      '</div>' +

      '<div class="no-break"><div class="sec">Dental History:</div>' +
        line('Last dental visit', d.lastVisit) +
        '<div class="ck-row"><span class="inline-lbl">Past extractions or oral surgeries:</span> ' + yesNo(d.pastExtractions) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Complications in previous dental treatments:</span> ' + yesNo(d.complications) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Oral hygiene habits:</span> ' + opts(d.hygiene, [['good','Good'],['fair','Fair'],['poor','Poor']]) + '</div>' +
      '</div>' +

      '<div class="no-break"><div class="sec">Extraoral Examination :</div>' +
        '<div class="ck-row"><span class="inline-lbl">Swelling:</span> ' + yesNo(d.swelling) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Facial symmetry:</span> ' + opts(d.symmetry, [['normal','Normal'],['asym','Asymmetrical']]) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Lymph nodes:</span> ' + opts(d.lymph, [['normal','Normal'],['enlarged','Enlarged']]) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">TMJ:</span> ' + opts(d.tmj, [['normal','Normal'],['clicking','Clicking'],['tender','Tenderness']]) + '</div>' +
      '</div>' +

      '<div class="no-break"><div class="sec">Intraoral Examination :</div>' +
        '<div class="ck-row"><span class="inline-lbl">Mucosa:</span> ' + opts(d.mucosa, [['normal','Normal'],['lesions','Lesions']]) + '</div>' +
        line('Tooth involved', d.toothInvolved) +
        '<div class="ck-row"><span class="inline-lbl">Tender on percussion:</span> ' + yesNo(d.percussion) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Mobility:</span> ' + yesNo(d.mobility) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Sinus tract or pus discharge:</span> ' + yesNo(d.sinus) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Trismus:</span> ' + yesNo(d.trismus) + '</div>' +
        line('Other findings', d.otherFindings) +
      '</div>' +

      '<div class="no-break"><div class="sec">Radiographic Findings :</div>' +
        '<div class="ck-row">' + multi(d, [['rxPeriapical','Periapical'],['rxOpg','OPG'],['rxCbct','CBCT']]) + '</div>' +
        line('Findings', d.rxFindings) +
      '</div>' +

      '<div class="no-break"><div class="sec">Final Diagnosis :</div>' + fillBlock(d.diagnosis, 2) + '</div>' +

      '<div class="no-break"><div class="sec">Planned Procedure :</div>' +
        '<div class="ck-row">' + multi(d, [['procSimpleExt','Simple extraction'],['procSurgicalExt','Surgical extraction'],['procIncision','Incision &amp; drainage']]) + '</div>' +
        '<div class="ck-row">' + multi(d, [['procCyst','Cyst enucleation'],['procBiopsy','Biopsy'],['procSoftTissue','Soft tissue surgery']]) + '</div>' +
        line('Tooth/Area', d.procTooth) +
        line('Type of anesthesia', d.anesthesia) +
      '</div>' +

      '<div class="no-break"><div class="sec">Post-operative instructions :</div>' +
        '<div class="ck-row">' + multi(d, [['poPain','Pain control (analgesics)'],['poBleeding','Bleeding control (gauze bite)']]) + '</div>' +
        '<div class="ck-row">' + multi(d, [['poCold','Cold compress (first 24 hrs)'],['poHygiene','Oral hygiene (gentle brushing, no rinsing 24 hrs)']]) + '</div>' +
        '<div class="ck-row">' + multi(d, [['poDiet','Soft diet'],['poSmoking','Avoid smoking and spitting']]) + '</div>' +
        '<div class="ck-row">' + ckOne(!!d.followupDays, 'Follow-up after') + ' <span class="fill" style="display:inline-block;min-width:44px">' + (esc(d.followupDays) || '&nbsp;') + '</span> days</div>' +
        (d.postOpNotes ? fillBlock(d.postOpNotes, 1) : '') +
      '</div>' +

      '<div class="no-break"><div class="sec">Supervisor Notes:</div>' + fillBlock(d.supervisorNotes, 2) + '</div>' +

      /* ---------- صفحة جدول التقييم + التوقيع (تظهر في الطباعة فقط — ليست في شاشة التعبئة) ---------- */
      '<div class="page-break no-break">' +
        '<div class="uni-head" style="margin-top:4px">' +
          '<div class="u1">Department of Oral surgery — Supervisor Evaluation</div>' +
        '</div>' +
        '<table class="eval"><thead><tr><th style="width:55%">criteria</th><th>Mark /</th><th>Mark</th></tr></thead><tbody>' +
          ['History &amp; Diagnosis','Clinical &amp; Radio Exam','Surgical Skills','Documentation','Patients Mangement','Total'].map(function (c) {
            return '<tr><td class="crit">' + c + '</td><td>&nbsp;</td><td>&nbsp;</td></tr>';
          }).join('') +
        '</tbody></table>' +
        '<div class="sig-row">' +
          '<div class="line"><span class="lbl">Supervisor\u2019s Name:</span><span class="fill">&nbsp;</span></div>' +
          '<div class="line"><span class="lbl">Supervisor\u2019s Signature:</span><span class="fill">&nbsp;</span></div>' +
        '</div>' +
      '</div>' +

      /* ---------- صفحة الصور — آخر صفحة كما في الكاسشيت الأصلي ---------- */
      '<div class="page-break">' +
        '<div class="sec" style="font-size:15px;text-align:center;text-decoration:none;letter-spacing:4px;margin-bottom:2mm">P h o t o g r a p h s :</div>' +
        '<div class="ph-grid">' +
          PHOTO_SLOTS.map(function (s) {
            var p = photos[s.key];
            return '<div class="ph-box no-break"><div class="cap">' + s.label + '</div><div class="img-wrap">' +
              (p && p.dataUrl ? '<img src="' + p.dataUrl + '" alt="" />' : '<span class="empty">&nbsp;</span>') +
            '</div></div>';
          }).join('') +
        '</div>' +
        '<div class="gen-note">Generated by DentPilot Student</div>' +
      '</div>';

    document.getElementById('sheet').innerHTML = html;
  }

  /* ---------- Operative Dentistry — يبدأ مباشرة من Student Name (بلا شعار/اسم جامعة/كلية/قسم/غلاف/عنوان كبير) ---------- */
  var EVAL_ROWS = [
    ['diagPrep', 'Diagnosis & Preparation'],
    ['restQuality', 'Restoration Quality'],
    ['infectionControl', 'Infection Control'],
    ['occlusionFinishing', 'Occlusion & Finishing'],
    ['attitude', 'Attitude & Communication'],
    ['total', 'Total']
  ];
  var PHOTO_SLOTS_OPERATIVE = [
    { key: 'preOp1', label: 'Pre operative Image' },
    { key: 'duringOp', label: 'During operative Image' },
    { key: 'preOp2', label: 'Pre operative Image' },
    { key: 'xray', label: 'X-ray Image' }
  ];

  function renderOperative(payload) {
    var d = (payload && payload.data) || {};
    var photos = (payload && payload.photos) || {};

    var html =
      '<div class="no-break">' +
        line('Student Name', d.studentName) +
        '<div class="ck-row"><span class="inline-lbl">Level:</span> ' + ckOne(d.level === '4th', '4th Year') + ckOne(d.level === '5th', '5th Year') + '</div>' +
        line('Clinic Date', d.clinicDate) +
        line('Supervisor of starting', d.supervisorStart) +
      '</div>' +
      '<hr class="rule" />' +

      '<div class="no-break">' +
        line('Patient Name', d.patientName) +
        '<div class="ck-row"><span class="inline-lbl">Gender:</span> ' + ckOne(d.gender === 'M', 'M') + ckOne(d.gender === 'F', 'F') +
          ' &nbsp;&nbsp;<span class="inline-lbl">Age:</span> <span class="fill" style="display:inline-block;min-width:44px">' + (esc(d.age) || '&nbsp;') + '</span>' +
          ' &nbsp;&nbsp;<span class="inline-lbl">Occupation:</span> <span class="fill" style="display:inline-block;min-width:120px">' + (esc(d.occupation) || '&nbsp;') + '</span></div>' +
        line('Address', d.address) +
        '<div class="ck-row"><span class="inline-lbl">Marital status:</span> <span class="fill" style="display:inline-block;min-width:60px">' + (esc(d.maritalStatus) || '&nbsp;') + '</span>' +
          ' &nbsp;&nbsp;<span class="inline-lbl">Phone No:</span> <span class="fill" style="display:inline-block;min-width:110px">' + (esc(d.phone) || '&nbsp;') + '</span></div>' +
        '<div class="sec" style="margin-top:9px">Chief Complaint:</div>' + fillBlock(d.chiefComplaint, 2) +
      '</div>' +

      '<div class="no-break"><div class="sec">Medical History:</div>' +
        '<div class="ck-row">' + ckOne(!!d.healthy, 'Healthy') + '</div>' +
        line('Chronic diseases', d.chronic) +
        line('Current medications', d.meds) +
        '<div class="ck-row"><span class="inline-lbl">Allergies:</span> ' + yesNo(d.allergies) + ' &rarr; <span class="fill" style="display:inline-block;min-width:130px">' + (esc(d.allergiesDetail) || '&nbsp;') + '</span></div>' +
      '</div>' +

      '<div class="no-break"><div class="sec">Dental History:</div>' +
        '<div class="ck-row"><span class="inline-lbl">Previous restorations:</span> ' + yesNo(d.prevRestorations) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">History of sensitivity/pain:</span> ' + yesNo(d.sensitivityHistory) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Oral hygiene:</span> ' + opts(d.hygiene, [['good','Good'],['fair','Fair'],['poor','Poor']]) + '</div>' +
      '</div>' +

      '<div class="no-break"><div class="sec">Clinical Examination:</div>' +
        line('Tooth involved', d.toothInvolved) +
        '<div class="ck-row"><span class="inline-lbl">Caries type:</span> ' + opts(d.cariesType, [['I','Class I'],['II','Class II'],['III','Class III'],['IV','Class IV'],['V','Class V'],['VI','Class VI']]) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Caries depth:</span> ' + opts(d.cariesDepth, [['enamel','Enamel'],['dentin','Dentin'],['pulpal','Pulpal']]) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Cavity walls condition:</span> ' + opts(d.cavityWalls, [['sound','Sound'],['weak','Weak']]) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Presence of old restoration:</span> ' + yesNo(d.oldRestoration) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Fracture or marginal defects:</span> ' + yesNo(d.fractureDefects) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Pain on percussion:</span> ' + yesNo(d.painPercussion) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Pulp vitality:</span> ' + opts(d.pulpVitality, [['normal','Normal'],['reversible','Reversible pulpitis'],['irreversible','Irreversible'],['necrotic','Necrotic']]) + '</div>' +
      '</div>' +

      '<div class="no-break"><div class="sec">Radiographic Findings:</div>' +
        '<div class="ck-row">' + multi(d, [['rxPeriapical','Periapical'],['rxBitewing','Bitewing']]) + '</div>' +
        line('Findings', d.rxFindings) +
      '</div>' +

      '<div class="no-break"><div class="sec">Final Diagnosis:</div>' + fillBlock(d.diagnosis, 2) + '</div>' +

      '<div class="no-break"><div class="sec">Planned Procedure:</div>' +
        '<div class="ck-row">' + multi(d, [['procComposite','Composite restoration'],['procGic','GIC filling'],['procAmalgam','Amalgam restoration']]) + '</div>' +
        '<div class="ck-row">' + multi(d, [['procLinerBase','Liner / Base applied'],['procTemporary','Temporary filling'],['procReferral','Referral to endo / perio']]) + '</div>' +
      '</div>' +

      '<div class="no-break"><div class="sec">Final Restoration Details:</div>' +
        line('Tooth #', d.frTooth) +
        '<div class="ck-row"><span class="inline-lbl">Material used:</span> ' + opts(d.frMaterial, [['composite','Composite'],['gic','GIC'],['amalgam','Amalgam']]) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Isolation method:</span> ' + opts(d.frIsolation, [['cotton','Cotton rolls'],['rubberdam','Rubber dam']]) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Cavity liner/base:</span> ' + yesNo(d.frLinerBase) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Matrix band used:</span> ' + yesNo(d.frMatrixBand) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Occlusion checked:</span> ' + yesNo(d.frOcclusion) + '</div>' +
        '<div class="ck-row"><span class="inline-lbl">Polishing done:</span> ' + yesNo(d.frPolishing) + '</div>' +
      '</div>' +

      '<div class="no-break"><div class="sec">Supervisor Notes:</div>' + fillBlock(d.supervisorNotes, 2) + '</div>' +

      /* ---------- جدول التقييم + التوقيع — صفحة مستقلة كما في المرجع ---------- */
      '<div class="page-break no-break">' +
        '<table class="eval"><thead><tr><th style="width:55%">criteria</th><th>Mark /</th><th>Mark</th></tr></thead><tbody>' +
          EVAL_ROWS.map(function (r) {
            return '<tr><td class="crit">' + r[1] + '</td><td>' + (esc(d['eval_' + r[0] + '_of']) || '&nbsp;') + '</td><td>' + (esc(d['eval_' + r[0] + '_mark']) || '&nbsp;') + '</td></tr>';
          }).join('') +
        '</tbody></table>' +
        '<div class="sig-row">' +
          '<div class="line"><span class="lbl">Supervisor\u2019s Name:</span><span class="fill">' + (esc(d.evalSupervisorName) || '&nbsp;') + '</span></div>' +
          '<div class="line"><span class="lbl">Supervisor\u2019s Signature:</span><span class="fill">' + (esc(d.evalSupervisorSignature) || '&nbsp;') + '</span></div>' +
        '</div>' +
      '</div>' +

      /* ---------- الصور — صفحة مستقلة كما في المرجع ---------- */
      '<div class="page-break">' +
        '<div class="sec" style="font-size:15px;text-align:center;text-decoration:none;letter-spacing:4px;margin-bottom:2mm">P h o t o g r a p h s :</div>' +
        '<div class="ph-grid">' +
          PHOTO_SLOTS_OPERATIVE.map(function (s) {
            var p = photos[s.key];
            return '<div class="ph-box no-break"><div class="cap">' + s.label + '</div><div class="img-wrap">' +
              (p && p.dataUrl ? '<img src="' + p.dataUrl + '" alt="" />' : '<span class="empty">&nbsp;</span>') +
            '</div></div>';
          }).join('') +
        '</div>' +
        '<div class="gen-note">Generated by DentPilot Student</div>' +
      '</div>';

    document.getElementById('sheet').innerHTML = html;

  function geFieldMark(f, d) {
    if (f.t === 'text') {
      var v = esc(d[f.k]);
      if (!v) return '';
      return '<div class="ge-print-field" style="left:' + f.x + '%;top:' + f.y + '%;width:' + f.w + '%;height:' + f.h + '%;">' + v + '</div>';
    }
    var checked = (f.t === 'radio') ? (d[f.g] === f.v) : !!d[f.k];
    if (!checked) return '';
    var cls = 'ge-print-mark' + (f.t === 'cell' ? ' cell' : (f.k.indexOf('tooth') === 0 ? ' tooth' : ''));
    return '<div class="' + cls + '" style="left:' + f.x + '%;top:' + f.y + '%;width:' + f.w + '%;height:' + f.h + '%;"></div>';
  }

  function renderGeniusEndodontic(payload) {
    var d = (payload && payload.data) || {};
    // تجاوز هوامش @page المشتركة: هذا الكاسشيت يحتاج الصفحة الكاملة بلا هامش لأن القالب هو صورة الصفحة الأصلية نفسها،
    // وهذا التجاوز مُقيَّد داخل هذه الدالة فقط (لا يُستدعى إلا لهذا القالب) فلا يمسّ Oral Surgery أو Operative Dentistry إطلاقاً.
    var styleOverride = document.createElement('style');
    styleOverride.textContent =
      '@page{ size:A4; margin:0; } ' +
      '.sheet{ max-width:none; padding:0; margin:0; } ' +
      '.ge-print-page{ position:relative; width:210mm; height:297mm; overflow:hidden; background-size:100% 100%; background-repeat:no-repeat; page-break-after:always; } ' +
      '.ge-print-page:last-child{ page-break-after:avoid; } ' +
      '.ge-print-field{ position:absolute; font-family:"Times New Roman", Georgia, serif; font-size:2.6mm; line-height:1.15; color:#111; overflow:hidden; white-space:nowrap; } ' +
      '.ge-print-mark{ position:absolute; border-radius:50%; background:radial-gradient(circle, #17403d 46%, transparent 48%); } ' +
      '.ge-print-mark.cell{ border-radius:1mm; background:rgba(11,90,84,.22); border:0.4mm solid #17403d; } ' +
      '.ge-print-mark.tooth{ border-radius:0.6mm; background:rgba(180,30,30,.28); border:0.4mm solid #b41e1e; }';
    document.head.appendChild(styleOverride);

    var p1Fields = GE_FIELDS.filter(function (f) { return f.p === 1; }).map(function (f) { return geFieldMark(f, d); }).join('');
    var p2Fields = GE_FIELDS.filter(function (f) { return f.p === 2; }).map(function (f) { return geFieldMark(f, d); }).join('');

    var html =
      '<div class="ge-print-page" style="background-image:url(genius-endo-p1.jpg)">' + p1Fields + '</div>' +
      '<div class="ge-print-page" style="background-image:url(genius-endo-p2.jpg)">' + p2Fields + '</div>';

    document.getElementById('sheet').innerHTML = html;
  }

  var payload = null;
  try { payload = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (payload && payload.data) {
    if (payload.template === 'genius-endodontic') renderGeniusEndodontic(payload);
    else if (payload.template === 'operative-dentistry') renderOperative(payload);
    else render(payload);
    document.title = 'Casesheet — ' + (payload.data.patientName || (payload.template === 'genius-endodontic' ? 'Endodontic Case Sheet' : payload.template === 'operative-dentistry' ? 'Operative Dentistry' : 'Oral Surgery'));
  } else {
    document.getElementById('sheet').innerHTML = '<div class="err-msg">لا توجد بيانات كاسشيت للعرض.<br/>افتح الكاسشيت داخل التطبيق ثم اضغط «معاينة الكاسشيت للطباعة».</div>';
  }

  document.getElementById('btnPrint').addEventListener('click', function () { window.print(); });
  document.getElementById('btnClose').addEventListener('click', function () { try { window.close(); } catch (e) {} history.length > 1 && history.back(); });

  // وضع الطباعة التلقائية عند القدوم من زر «طباعة / تصدير PDF»
  if (/(\?|&)print=1/.test(location.search) && payload && payload.data) {
    setTimeout(function () { window.print(); }, 450);
  }
})();
